<!doctype html><title>sdrprobe Viewer</title>
<style>
  /* The page is exactly the viewport and never scrolls: a live picture a
     reader has to scroll to see the bottom of is a picture they are
     reading half of. Everything with a fixed height (the title, the tab
     bar, the hud, the health footer) takes what it needs; `#panels` takes
     the rest, and whatever the active view puts in there divides that up
     in turn. Anything that can genuinely outgrow its room -- a decode
     table, a candidate list -- scrolls inside its own panel, so the page
     stays put while the panel does not lose rows. */
  html, body { height:100%; }
  body { background:#0c131c; color:#c7d3dc; font:14px monospace; margin:0;
         padding:16px; box-sizing:border-box; overflow:hidden;
         display:flex; flex-direction:column; }
  h1 { font-size:16px; color:#e8edf0; margin:0 0 10px; flex:0 0 auto; }
  #hud { margin-bottom:10px; color:#5adca4; flex:0 0 auto; }
  #hud .stale { color:#ff6864; }
  /* min-height:0 is what lets a flex child be *smaller* than its content;
     without it a canvas or a long table pushes the column past the
     viewport and the scrollbar comes back. */
  #panels { flex:1 1 auto; min-height:0; }
  #panels > div { height:100%; display:flex; flex-direction:column;
                  min-height:0; }
  /* An author `display` beats the `hidden` attribute's own UA rule, so
     without this every view's panel is laid out at once and the three of
     them stack down the page. It is not a tidying rule: `selectView()`
     sets `hidden`, and this is what makes that mean anything. */
  #panels > div[hidden] { display:none; }
  canvas { display:block; background:#0a0f16; }
  .label { color:#8291a0; margin:4px 0; flex:0 0 auto; }
  #health { margin:10px 0 0; color:#8291a0; border-top:1px solid #232f3b;
            padding-top:8px; flex:0 0 auto; }
  #health span { color:#c7d3dc; }
  #health .row { margin:2px 0; }
  #tabs { margin-bottom:14px; flex:0 0 auto; }
  #tabs button { background:#16202c; color:#8291a0; border:1px solid #232f3b; font:14px monospace; padding:6px 16px; cursor:pointer; }
  #tabs button.active { background:#1d3b3a; color:#5adca4; border-color:#2e5a58; }
  table { border-collapse:collapse; width:100%; }
  th, td { text-align:left; padding:3px 10px 3px 0; font:13px monospace; }
  th { color:#8291a0; border-bottom:1px solid #232f3b; }
  td { color:#c7d3dc; }
  .mark-signal { color:#5adcc8; }
  .mark-empty { color:#8291a0; }
  .mark-receiver { color:#ff9b64; }
  .mark-contested { color:#ff6864; }
</style>
<h1>sdrprobe -- live Viewer</h1>
<!-- Ticket 14, Phase 3: the tab bar and every panel are built from
     web/views/*.js's own registry (`VIEWS` in viewer.js), not written
     out here -- adding a view touches views/ and the registry line, not
     this file. -->
<div id="tabs"></div>
<div id="hud">connecting...</div>
<div id="panels"></div>
<div class="label">link health</div>
<div id="health">awaiting link_health...</div>
